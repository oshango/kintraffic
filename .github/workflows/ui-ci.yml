name: UI CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  group: ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '22.22.3'
        cache: npm
        cache-dependency-path: ui/kintraffic-ui/package-lock.json

    - name: Install dependencies
      run: npm ci --prefix ./ui/kintraffic-ui

    - name: Test
      run: npm test --prefix ./ui/kintraffic-ui -- --runInBand --watch=false --ci

    - name: Build
      run: npm run build --prefix ./ui/kintraffic-ui

    - name: Upload UI artifact
      uses: actions/upload-artifact@v4
      with:
        name: kintraffic-ui-${{ github.sha }}
        path: ./ui/kintraffic-ui/dist/kintraffic-ui
        if-no-files-found: error
        retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
    - name: Download UI artifact
      uses: actions/download-artifact@v4
      with:
        name: kintraffic-ui-${{ github.sha }}
        path: ./ui-artifact

    - uses: Azure/static-web-apps-deploy@v1
      with:
        action: "upload"
        azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        app_location: "ui-artifact"
        skip_app_build: true

    - name: Verify UI health
      env:
        UI_URL: ${{ vars.PRODUCTION_UI_URL }}
      run: curl --fail --silent --show-error --location --retry 10 --retry-delay 5 --retry-all-errors "$UI_URL"
