name: OSH Auto Branch Creation

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  create-branch:
    if: github.event.label.name == 'in-progress'
    runs-on: ubuntu-latest

    steps:
      - name: Extract OSH number and title
        id: extract
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = context.payload.issue.title;

            const match = title.match(/^OSH-(\d+)\s*—\s*(.*)$/);
            if (!match) {
              core.setFailed("Issue is not an OSH issue.");
              return;
            }

            const oshNumber = match[1];
            const rawTitle = match[2];

            const slug = rawTitle
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, "-")
              .replace(/^-+|-+$/g, "");

            const branch = `feature/OSH-${oshNumber}-${slug}`;

            core.setOutput("branch", branch);

      - name: Create branch
        uses: actions/github-script@v7
        env:
          BRANCH: ${{ steps.extract.outputs.branch }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branch = process.env.BRANCH;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = await github.rest.git.getRef({
              owner,
              repo,
              ref: "heads/develop"
            });

            let branchExists = false;
            try {
              await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
              branchExists = true;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (!branchExists) {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/heads/${branch}`,
                sha: ref.data.object.sha
              });
            }

            core.setOutput("branch", branch);

      - name: Comment branch name on issue
        uses: actions/github-script@v7
        env:
          BRANCH: ${{ steps.extract.outputs.branch }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branch = process.env.BRANCH;
            const issue = context.payload.issue;
            const marker = `<!-- osh-branch:${issue.number} -->`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 100
            });

            if (!comments.some(comment => comment.body?.includes(marker))) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "Branch ready for selected work: `" + branch + "`\n\n" + marker
              });
            }
