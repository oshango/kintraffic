name: API CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - run: dotnet restore ./api/KinTraffic.Api/KinTraffic.Api.csproj
    - run: dotnet build ./api/KinTraffic.Api/KinTraffic.Api.csproj --configuration Release --no-restore

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: azure/webapps-deploy@v2
      with:
        app-name: KinTraffic-Api
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ./api/KinTraffic.Api
