name: OSH Auto Kanban Movement

on:
  issues:
    types: [opened]
  push:
    branches:
      - 'feature/OSH-*'
  pull_request:
    types: [opened, closed]

permissions:
  issues: write
  pull-requests: read

jobs:
  move-to-todo:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Move issue to Todo
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = context.payload.issue.number;
            const stateLabels = ["todo", "in-progress", "in-review", "done"];
            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
            for (const label of issue.labels.map(item => item.name)) {
              if (stateLabels.includes(label) && label !== "todo") {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name: label });
              }
            }
            const labels = new Set(issue.labels.map(item => item.name));
            const missing = ["OSH", "todo"].filter(label => !labels.has(label));
            if (missing.length) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels: missing });
            }

  move-to-in-progress:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Find linked OSH issue
        id: find_issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branch = context.ref.replace("refs/heads/", "");
            const match = branch.match(/(?:^|\/)OSH-(\d+)(?:-|$)/);
            if (!match) return;

            const oshNumber = match[1];

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });

            const exactTitle = new RegExp(`^OSH-${oshNumber}(?:\\s|$|[-—])`, "i");
            const issue = issues.find(i => !i.pull_request && exactTitle.test(i.title));
            if (issue) core.setOutput("issue_number", issue.number);

      - name: Move issue to In Progress
        if: steps.find_issue.outputs.issue_number
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.find_issue.outputs.issue_number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const stateLabels = ["todo", "in-progress", "in-review", "done"];
            const target = "in-progress";
            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
            for (const label of issue.labels.map(item => item.name)) {
              if (stateLabels.includes(label) && label !== target) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name: label });
              }
            }
            if (!issue.labels.some(item => item.name === target)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels: [target] });
            }

  move-to-in-review:
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Find linked OSH issue
        id: find_issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = context.payload.pull_request.title;
            const match = title.match(/OSH-(\d+)(?=\D|$)/);
            if (!match) return;

            const oshNumber = match[1];

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });

            const exactTitle = new RegExp(`^OSH-${oshNumber}(?:\\s|$|[-—])`, "i");
            const issue = issues.find(i => !i.pull_request && exactTitle.test(i.title));
            if (issue) core.setOutput("issue_number", issue.number);

      - name: Move issue to In Review
        if: steps.find_issue.outputs.issue_number
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.find_issue.outputs.issue_number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const stateLabels = ["todo", "in-progress", "in-review", "done"];
            const target = "in-review";
            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
            for (const label of issue.labels.map(item => item.name)) {
              if (stateLabels.includes(label) && label !== target) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name: label });
              }
            }
            if (!issue.labels.some(item => item.name === target)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels: [target] });
            }

  move-to-done:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Find linked OSH issue
        id: find_issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = context.payload.pull_request.title;
            const match = title.match(/OSH-(\d+)(?=\D|$)/);
            if (!match) return;

            const oshNumber = match[1];

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });

            const exactTitle = new RegExp(`^OSH-${oshNumber}(?:\\s|$|[-—])`, "i");
            const issue = issues.find(i => !i.pull_request && exactTitle.test(i.title));
            if (issue) core.setOutput("issue_number", issue.number);

      - name: Move issue to Done
        if: steps.find_issue.outputs.issue_number
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.find_issue.outputs.issue_number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const stateLabels = ["todo", "in-progress", "in-review", "done"];
            const target = "done";
            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
            for (const label of issue.labels.map(item => item.name)) {
              if (stateLabels.includes(label) && label !== target) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name: label });
              }
            }
            if (!issue.labels.some(item => item.name === target)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels: [target] });
            }
