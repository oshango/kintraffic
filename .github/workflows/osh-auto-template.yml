name: OSH Auto Template

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  apply-template:
    runs-on: ubuntu-latest

    steps:
      - name: Preserve issue content and add defaults
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = issue.number;
            const title = issue.title.replace(/^OSH-\d+\s*—\s*/, "");

            if (!issue.body?.trim()) {
              const oshNumber = issue.number;
              const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
              const body = [
                "## Description",
                title,
                "",
                "## Acceptance Criteria",
                "- [ ] Implementation completed",
                "- [ ] Tests added or updated",
                "- [ ] Pull request reviewed and merged",
                "- [ ] CI checks pass",
                "",
                "## Branch Name",
                `feature/OSH-${oshNumber}-${slug}`,
                "",
                "## PR Title Format",
                `feat: OSH-${oshNumber}: ${title}`,
                "",
                "## Linked OSH",
                `OSH-${oshNumber}`
              ].join("\n");

              await github.rest.issues.update({ owner, repo, issue_number: issueNumber, body });
            }

            const existingLabels = new Set((issue.labels || []).map(label => typeof label === "string" ? label : label.name));
            const missingLabels = ["OSH", "todo"].filter(label => !existingLabels.has(label));
            if (missingLabels.length > 0) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels: missingLabels });
            }
