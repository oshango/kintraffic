name: OSH Auto Numbering

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  auto-number:
    if: ${{ !startsWith(github.event.issue.title, 'OSH-') }}
    runs-on: ubuntu-latest

    steps:
      - name: Allocate collision-checked OSH identifier
        id: get_osh
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const oshNumber = String(issue.number);
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "all",
              per_page: 100
            });

            const prefix = new RegExp(`^OSH-${oshNumber}(?:\\s|$|[-—])`, "i");
            const conflict = issues.find(existing => existing.number !== issue.number && prefix.test(existing.title));
            if (conflict) {
              core.setFailed(`Cannot assign OSH-${oshNumber}: it is already used by issue #${conflict.number}. Resolve the identifier conflict manually.`);
              return;
            }

            core.setOutput("osh_number", oshNumber);

      - name: Rename issue with OSH number
        uses: actions/github-script@v7
        env:
          OSH_NUMBER: ${{ steps.get_osh.outputs.osh_number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const oshNumber = process.env.OSH_NUMBER;
            const oldTitle = context.payload.issue.title;
            const newTitle = `OSH-${oshNumber} — ${oldTitle}`;

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              title: newTitle
            });

      - name: Add OSH label
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels: ["OSH"]
            });
