<div class="app-shell">
  <aside class="sidebar" aria-label="Primary navigation">
    <a class="brand" routerLink="/" aria-label="KinTraffic home">
      <span class="brand-mark" aria-hidden="true">K</span>
      <span>KINTRAFFIC</span>
    </a>

    <p class="nav-label">OPERATIONS</p>
    <nav class="nav-list">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <span class="nav-index">01</span> Overview
      </a>
      <a routerLink="/assets" routerLinkActive="active"><span class="nav-index">02</span> Assets</a>
      <a routerLink="/faults" routerLinkActive="active"><span class="nav-index">03</span> Faults</a>

      <a routerLink="/audit" routerLinkActive="active"><span class="nav-index">08</span> Audit log</a>

    <div class="sidebar-footer">
      <span>Service checks</span>
      <a routerLink="/health">Health <span aria-hidden="true">↗</span></a>
    </div>
  </aside>

  <main class="main-panel">
    <header class="topbar">
      <span>KINSHASA <span class="topbar-divider">/</span> TRAFFIC MANAGEMENT</span>
      <a routerLink="/login">Sign in <span aria-hidden="true">↗</span></a>
