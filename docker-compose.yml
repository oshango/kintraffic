services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    mem_limit: 2560m
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_MEMORY_LIMIT_MB: "2048"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in your shell or root .env file}
    ports:
      - "1433:1433"
    volumes:
      - kintraffic-sql-data-v3:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -C -U sa -P "$${MSSQL_SA_PASSWORD}" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 15s
      retries: 15
      start_period: 90s

  api:
    image: kintraffic-api:latest
    restart: unless-stopped
    mem_limit: 512m
    build:
      context: ./api/KinTraffic.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__KinTraffic: Server=database,1433;Database=KinTraffic;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in your shell or root .env file};Encrypt=True;TrustServerCertificate=True
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy

  ui:
    image: kintraffic-ui:latest
    restart: unless-stopped
    mem_limit: 256m
    build:
      context: ./ui/kintraffic-ui
    ports:
      - "4200:4200"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4200/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - api

volumes:
  kintraffic-sql-data-v3:
