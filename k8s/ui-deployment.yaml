apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: kintraffic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: kintraffic-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4200
          env:
            - name: API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: kintraffic-config
                  key: API_BASE_URL
---
